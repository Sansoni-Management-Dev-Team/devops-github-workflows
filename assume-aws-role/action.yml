name: Assume AWS IAM Role
description: Assumes an AWS IAM role via OIDC and configures credentials for subsequent steps.

inputs:
  role-arn:
    description: ARN of the AWS IAM role to assume
    required: true
  region:
    description: AWS region to configure
    required: true
  duration-seconds:
    description: Duration, in seconds, of the assumed role session
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    - name: Assume AWS IAM role
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: ${{ inputs.duration-seconds }}
