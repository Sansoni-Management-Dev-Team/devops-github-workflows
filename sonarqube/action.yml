name: SonarQube Scan
description: >
  Runs a SonarQube analysis (code quality and security) and fails when the
  quality gate fails, so it can be used as a required pull request check.
  Run the `checkout` action (full history, fetch-depth 0) before this one.

inputs:
  sonar-token:
    description: SonarQube token used to authenticate the analysis
    required: true
  sonar-host-url:
    description: SonarQube URL. Defaults to SonarQube Cloud; set it for a self-hosted SonarQube Server
    required: false
    default: "https://sonarcloud.io"
  organization:
    description: SonarQube Cloud organization key
    required: false
    default: "sansoni-management-dev-team"
  project-key:
    description: SonarQube project key. Defaults to "<repo owner>_<repo name>"
    required: false
    default: ""
  project-base-dir:
    description: Directory to analyze, relative to the repository root
    required: false
    default: "."
  wait-for-quality-gate:
    description: Wait for the quality gate result and fail the step if it fails
    required: false
    default: "true"
  quality-gate-timeout:
    description: Seconds to wait for the quality gate result before failing
    required: false
    default: "300"
  pull-request-analysis:
    description: >
      On pull_request events, analyze the PR against its base branch so the
      quality gate only checks the lines changed in the PR
    required: false
    default: "true"
  args:
    description: Extra scanner arguments, e.g. "-Dsonar.projectKey=my-project"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v7
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      with:
        projectBaseDir: ${{ inputs.project-base-dir }}
        args: >
          -Dsonar.organization=${{ inputs.organization }}
          -Dsonar.projectKey=${{ inputs.project-key || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
          -Dsonar.qualitygate.wait=${{ inputs.wait-for-quality-gate }}
          -Dsonar.qualitygate.timeout=${{ inputs.quality-gate-timeout }}
          ${{ (inputs.pull-request-analysis == 'true' && github.event.pull_request) && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || '' }}
          ${{ inputs.args }}
